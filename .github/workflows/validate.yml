name: validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Os testes de menu exigem uma raiz isolada explícita (tests/menu-actions.test.mjs).
      - run: npm test
        env:
          CT56_MENU_TEST_ROOT: ${{ runner.temp }}/ct56-menu
      - run: git diff --exit-code -- dist
      - run: npm run benchmark
      - run: npm pack --dry-run
